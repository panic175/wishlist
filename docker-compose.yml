name: wishlist

services:
  app:
    container_name: wishlist
    restart: unless-stopped
    # Secrets come decrypted from the pre-deploy hook (sops -> .env.runtime).
    env_file:
      - .env.runtime
    environment:
      # User/Group IDs (defaults to 1000:1000, Unraid users set to 99:100)
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      # Authelia forward-auth (protects the /admin area via Traefik)
      - AUTHELIA_ENABLED=${AUTHELIA_ENABLED:-true}
      # Must match the header Authelia's forwardAuthMiddleware injects
      # (authResponseHeaders on the Authelia container = Remote-User).
      - AUTHELIA_USER_HEADER=${AUTHELIA_USER_HEADER:-Remote-User}
      - AUTHELIA_PORTAL_URL=${AUTHELIA_PORTAL_URL:-https://auth.home.niemann.dev}
    # Embed the image build (required to ship the Authelia/CSV/scraper code):
    # it must be a version of THIS repo, otherwise the env vars above do nothing.
    build:
      context: .
    volumes:
      - /opt/docker/wishlist/data:/app/data
    labels:
      - "traefik.enable=true"
      # LAN host - public wishlist area (viewing/claiming stay public).
      # Admin is excluded so only wishlist-admin (below) can match it.
      - "traefik.http.routers.wishlist.entrypoints=websecure"
      - 'traefik.http.routers.wishlist.rule=Host(`${WISHLIST_LAN_DOMAIN:-wishlist.home.niemann.dev}`) && !PathRegexp(`^/admin(?:/.*)?$$`)'
      - "traefik.http.routers.wishlist.tls=true"
      - "traefik.http.routers.wishlist.service=wishlist"
      - "traefik.http.routers.wishlist.middlewares=stripUserHeader@file,secHeaders@file,localIpWhitelist@file"
      # LAN host - admin router, behind Authelia forward-auth. authelia@docker
      # is defined in labels on the Authelia container (same 'web' network).
      - "traefik.http.routers.wishlist-admin.entrypoints=websecure"
      - 'traefik.http.routers.wishlist-admin.rule=Host(`${WISHLIST_LAN_DOMAIN:-wishlist.home.niemann.dev}`) && PathRegexp(`^/admin(?:/.*)?$$`)'
      - "traefik.http.routers.wishlist-admin.tls=true"
      - "traefik.http.routers.wishlist-admin.service=wishlist"
      - "traefik.http.routers.wishlist-admin.middlewares=stripUserHeader@file,authelia@docker,secHeaders@file,localIpWhitelist@file"
      # Public host - wishlist area ONLY: no admin router exists for it, so
      # /admin/* is unroutable (Traefik 404). Admin/Authelia stay LAN-only.
      - "traefik.http.routers.wishlist-public.entrypoints=websecure"
      - 'traefik.http.routers.wishlist-public.rule=Host(`${WISHLIST_DOMAIN:-wishlist.niemann.dev}`) && !PathRegexp(`^/admin(?:/.*)?$$`)'
      - "traefik.http.routers.wishlist-public.tls=true"
      - "traefik.http.routers.wishlist-public.service=wishlist"
      - "traefik.http.routers.wishlist-public.middlewares=stripUserHeader@file,secHeaders@file"
      # Shared service (same backend for all routers)
      - "traefik.http.services.wishlist.loadbalancer.server.port=3000"
      - "traefik.docker.network=web"
    dns:
      - 192.168.3.3
    networks:
      - web

networks:
  web:
    external: true